<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ADTv2 branch dashboard</title>
    <style>
      :root { color-scheme: light; --bg: #f4efe5; --panel: #fffdf8; --ink: #1e1a16; --muted: #6e655b; --border: #d6cab8; --pass: #2f6a3d; --fail: #8f2d23; --skip: #8a6a1f; }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: Georgia, "Iowan Old Style", serif; color: var(--ink); background: linear-gradient(180deg, #fbf6eb 0%, #efe6d4 100%); }
      main { max-width: 1100px; margin: 0 auto; padding: 3rem 1.5rem 4rem; }
      .hero, .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 24px; box-shadow: 0 18px 40px rgba(50, 36, 18, 0.08); }
      .hero { padding: 2rem; margin-bottom: 1.5rem; }
      .panel { padding: 1.5rem; }
      h1, h2 { margin: 0 0 0.75rem; font-weight: 600; }
      p { margin: 0.35rem 0; color: var(--muted); }
      table { width: 100%; border-collapse: collapse; }
      th, td { padding: 0.9rem 0.8rem; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
      th { font-size: 0.9rem; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
      tr.pass td:nth-child(2) { color: var(--pass); font-weight: 700; }
      tr.fail td:nth-child(2) { color: var(--fail); font-weight: 700; }
      tr.skip td:nth-child(2) { color: var(--skip); font-weight: 700; }
      code { font-size: 0.92rem; }
      a { color: inherit; }
    </style>
  </head>
  <body>
    <main>
      <section class="hero">
        <h1>ADTv2 branch dashboard</h1>
        <p>Repository: <code>yruellan/lisa</code></p>
        <p>Each row points to the latest report published for that branch.</p>
      </section>
      <section class="panel">
        <h2>Branches</h2>
        <table>
          <thead>
            <tr>
              <th>Branch</th>
              <th>Status</th>
              <th>Examples</th>
              <th>Commit</th>
              <th>Updated</th>
            </tr>
          </thead>
          <tbody>
            <tr class="pass"><td><a href="branches//">.pages/branches/adt-510911ca0904/metadata.tsv</a></td><td></td><td> pass /  fail /  skipped</td><td><code></code></td><td></td></tr>
          </tbody>
        </table>
      </section>
    </main>
  </body>
</html>
